name = "dtfcrowd-app"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2025-06-26"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
keep_vars = true


# ============================================================================
# LOCAL DEVELOPMENT
# ============================================================================

[[d1_databases]]
binding = "DB"
database_name = "dtfcrowd-db"
database_id = "6c3e6748-7e5c-450d-9565-d24739442341"
migrations_dir = "db/migrations"


[assets]
binding = "ASSETS"
directory = "./dist"


[observability.logs]
enabled = true


# ============================================================================
# STAGING
# ============================================================================

[env.staging]
name = "dtfcrowd-app-staging"

routes = [
    { pattern = "dtf-staging.v4.goteo.org", zone_name = "goteo.org", custom_domain = true },
]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "dtfcrowd-db-staging"
database_id = "9c338a5d-f860-488c-b0c0-46b5b74f0492"
migrations_dir = "db/migrations"


# ============================================================================
# PRODUCTION
# ============================================================================

[env.prod]
name = "dtfcrowd-app-prod"

routes = [
    { pattern = "dtf.v4.goteo.org", zone_name = "goteo.org", custom_domain = true },
]

[[env.prod.d1_databases]]
binding = "DB"
database_name = "dtfcrowd-db-prod"
database_id = "b682c189-c6f2-4932-aae0-f08185efeba9"
migrations_dir = "db/migrations"
